[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-sorter"
version = "0.1.0"
description = "Lightweight video-to-dataset frame sorting tool with ROI support and optional C++ acceleration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "opencv-python>=4.9",
  "numpy>=1.26"
]

[project.optional-dependencies]
native = [
  "pybind11>=2.12"
]
dev = [
  "pytest>=8"
]

[project.scripts]
frame-sorter = "frame_sorter.main:main"

[tool.setuptools.packages.find]
include = ["frame_sorter*"]
